<nav class="navbar navbar-expand bg-white border-bottom py-2 shadow-sm sticky-top">
    <div class="container-fluid px-4">

        <!-- Left: Toggle & Program Name -->
        <div class="d-flex align-items-center gap-3">
            <button (click)="mainLayoutService.toggleSidebar()"
                class="btn btn-outline-secondary d-flex align-items-center justify-content-center border rounded-2"
                style="width: 38px; height: 38px;"
                title="เปิด/ปิดเมนู">
                <i class="bi bi-list" style="font-size: 1.4rem;"></i>
            </button>
            <div class="d-flex align-items-center">
                <div class="bg-blue-600 rounded-lg p-1 me-2 d-flex align-items-center justify-content-center"
                    style="width: 28px; height: 28px;">
                    <i class="bi bi-layers-fill text-white fs-6"></i>
                </div>
                <span class="fs-5 fw-bold tracking-tight text-slate-800 d-none d-sm-block">CleanApp</span>
                <span class="ms-3 badge bg-slate-100 text-slate-600 border border-slate-200" *ngIf="currentProgramCode()">
                    {{ currentProgramCode() }}
                </span>
            </div>
        </div>

        <!-- Center: Org Switcher -->
        <div class="d-flex justify-content-center position-absolute start-50 translate-middle-x">
            <div class="dropdown">
                <button
                    class="btn btn-light border-0 bg-slate-50 text-slate-700 fw-medium dropdown-toggle px-3 py-2 rounded-pill d-flex align-items-center gap-2"
                    type="button" id="orgDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-building"></i>
                    {{ currentOrg()?.orgName || 'Select Organization' }}
                </button>
                <ul class="dropdown-menu shadow-lg border-0 rounded-3 mt-2" aria-labelledby="orgDropdown">
                    <li *ngFor="let org of organizations()">
                        <a class="dropdown-item py-2 px-3 d-flex align-items-center justify-content-between"
                            (click)="switchOrg(org.orgId)" style="cursor: pointer;">
                            <span class="fw-medium">{{ org.orgName }}</span>
                            <i *ngIf="currentOrg()?.orgId === org.orgId" class="bi bi-check-lg text-primary"></i>
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Right: Logout & Notifications -->
        <div class="d-flex align-items-center gap-3 ms-auto">
            <!-- Notifications (Placeholder) -->
            <button class="btn btn-light border-0 text-muted p-2 rounded-circle position-relative d-none d-sm-block">
                <i class="bi bi-bell fs-5"></i>
                <span
                    class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle">
                    <span class="visually-hidden">New alerts</span>
                </span>
            </button>

            <!-- Direct Logout Button -->
            <button (click)="logout()" class="btn btn-outline-danger d-flex align-items-center gap-2 rounded-pill px-3 fw-medium border-0">
                <i class="bi bi-box-arrow-right fs-5"></i>
                <span class="d-none d-md-block">Logout</span>
            </button>
        </div>

    </div>
</nav>
