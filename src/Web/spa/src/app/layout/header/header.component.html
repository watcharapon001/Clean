<nav class="navbar navbar-expand bg-white border-bottom py-2 shadow-sm sticky-top">
    <div class="container-fluid px-4">

        <!-- Left: Toggle & Title/Search -->
        <div class="d-flex align-items-center gap-3">
            <button (click)="mainLayoutService.toggleSidebar()"
                class="btn btn-light border-0 text-slate-500 hover:text-slate-800 p-2 rounded-circle">
                <i class="bi bi-list fs-4"></i>
            </button>

            <div class="d-none d-md-block">
                <span class="badge bg-slate-100 text-slate-600 border border-slate-200" *ngIf="currentProgramCode()">
                    {{ currentProgramCode() }}
                </span>
            </div>
        </div>

        <!-- Center: Org Switcher -->
        <div class="d-flex justify-content-center">
            <div class="dropdown">
                <button
                    class="btn btn-light border-0 bg-slate-50 text-slate-700 fw-medium dropdown-toggle px-3 py-2 rounded-pill d-flex align-items-center gap-2"
                    type="button" id="orgDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-building"></i>
                    {{ currentOrg()?.orgName || 'Select Organization' }}
                </button>
                <ul class="dropdown-menu shadow-lg border-0 rounded-3 mt-2" aria-labelledby="orgDropdown">
                    <li *ngFor="let org of organizations()">
                        <a class="dropdown-item py-2 px-3 d-flex align-items-center justify-content-between"
                            (click)="switchOrg(org.orgId)" style="cursor: pointer;">
                            <span class="fw-medium">{{ org.orgName }}</span>
                            <i *ngIf="currentOrg()?.orgId === org.orgId" class="bi bi-check-lg text-primary"></i>
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Right: User Profile -->
        <div class="d-flex align-items-center gap-3">
            <!-- Notifications (Placeholder) -->
            <button class="btn btn-light border-0 text-muted p-2 rounded-circle position-relative">
                <i class="bi bi-bell fs-5"></i>
                <span
                    class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle">
                    <span class="visually-hidden">New alerts</span>
                </span>
            </button>

            <!-- User Dropdown -->
            <div class="dropdown">
                <button class="btn btn-link text-decoration-none p-0 d-flex align-items-center gap-2" type="button"
                    id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                    <div class="avatar bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold"
                        style="width: 36px; height: 36px;">
                        {{ currentUser()?.displayName?.charAt(0) || 'U' }}
                    </div>
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0 rounded-3 mt-2 p-2"
                    aria-labelledby="userDropdown" style="min-width: 200px;">
                    <li>
                        <h6 class="dropdown-header text-uppercase text-xs fw-bold text-slate-400">Account</h6>
                    </li>
                    <li><a class="dropdown-item rounded-2 py-2" href="#"><i class="bi bi-person me-2 text-muted"></i>
                            Profile</a></li>
                    <li><a class="dropdown-item rounded-2 py-2" href="#"><i class="bi bi-gear me-2 text-muted"></i>
                            Settings</a></li>
                    <li>
                        <hr class="dropdown-divider my-2">
                    </li>
                    <li>
                        <button (click)="logout()"
                            class="dropdown-item rounded-2 py-2 text-danger d-flex align-items-center">
                            <i class="bi bi-box-arrow-right me-2"></i> Logout
                        </button>
                    </li>
                </ul>
            </div>
        </div>

    </div>
</nav>
