<div class="d-flex flex-column w-100 h-100 overflow-hidden">
  <!-- Header (Top 100% width) -->
  <app-header class="w-100 flex-shrink-0 shadow-sm z-3"></app-header>
  
  <mat-progress-bar mode="indeterminate" *ngIf="isLoadingRoute()" class="w-100" style="position: absolute; top: 60px; z-index: 9999; height: 3px;"></mat-progress-bar>

  <!-- Bottom Content Split -->
  <div class="d-flex flex-grow-1 overflow-hidden position-relative">
    <!-- Sidebar -->
    <app-sidebar
      class="flex-shrink-0 shadow-sm z-2"
      [style.width]="mainLayoutService.isSidebarOpen() ? '280px' : '0px'"
      [style.transition]="'width 0.3s ease-in-out'"
      style="overflow: hidden"
    >
    </app-sidebar>

    <!-- Content -->
    <main class="flex-grow-1 overflow-auto p-4 bg-slate-50 z-1">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
