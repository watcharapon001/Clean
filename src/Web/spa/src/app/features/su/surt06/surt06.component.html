<div class="container-fluid py-4">
  <!-- Action Bar -->
  <app-action-bar>
    <button mat-raised-button color="primary" class="d-flex align-items-center gap-2" (click)="openDialog()">
      <mat-icon>add</mat-icon>
      Add Organization
    </button>
  </app-action-bar>

  <app-card>
    <div class="card-content p-0">
      
      <!-- Filter Header -->
      <div class="p-3 border-bottom bg-light">
        <div class="row align-items-center">
            <div class="col-md-4">
                <input type="text" 
                       class="form-control" 
                       (keyup)="applyFilter($event)" 
                       placeholder="Search by code or name...">
            </div>
        </div>
      </div>

      <!-- Table Wrapper -->
      <div class="table-responsive">
        <table mat-table [dataSource]="dataSource" matSort class="w-100">

          <!-- OrgCode Column -->
          <ng-container matColumnDef="orgCode">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Organization </th>
            <td mat-cell *matCellDef="let element">
                <a (click)="openDialog(element)"
                    class="d-flex align-items-center py-2 text-decoration-none text-dark group-hover"
                    style="cursor: pointer;">
                    <div class="avatar bg-light text-primary rounded-circle d-flex align-items-center justify-content-center me-3"
                        style="width: 40px; height: 40px;">
                        <mat-icon>business</mat-icon>
                    </div>
                    <div>
                        <div class="fw-bold hover-primary">{{ element.orgName }}</div>
                        <div class="small text-muted">{{ element.orgCode }}</div>
                    </div>
                </a>
            </td>
          </ng-container>

          <!-- Status Column -->
          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Status </th>
            <td mat-cell *matCellDef="let element">
              <span class="px-2 py-1 rounded text-xs"
                    [ngClass]="element.isActive ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-800'">
                {{ element.isActive ? 'Active' : 'Inactive' }}
              </span>
            </td>
          </ng-container>

          <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="text-end"> Actions </th>
            <td mat-cell *matCellDef="let element" class="text-end">
              <button mat-icon-button color="warn" matTooltip="Delete" (click)="deleteOrg(element)">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover:bg-gray-50 transition-colors"></tr>

          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell text-center py-4 text-muted" colspan="3">
              No organizations found matching the filter.
            </td>
          </tr>
        </table>
      </div>

      <mat-paginator [length]="totalCount" [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons></mat-paginator>

    </div>
  </app-card>
</div>
