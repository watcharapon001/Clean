<div class="container-fluid py-4">

    <!-- Action Bar -->
    <app-action-bar backLink="/su">
        <button mat-raised-button color="primary" (click)="savePermissions()" [disabled]="!selectedProfileId || isSaving()">
            <mat-icon *ngIf="!isSaving()">save</mat-icon>
            <mat-spinner diameter="20" *ngIf="isSaving()" class="d-inline-block me-2"></mat-spinner>
            {{ isSaving() ? 'Saving...' : 'Save Permissions' }}
        </button>
        <button mat-stroked-button color="accent" (click)="exportData()" class="ms-2" [disabled]="!selectedProfileId">
            <i class="bi bi-file-earmark-excel me-2"></i> Export to Excel
        </button>
    </app-action-bar>

    <div class="row justify-content-center">
        <div class="col-12">
            <app-card>

    <div class="card-content p-3 h-100 d-flex flex-column gap-3">
        <div class="row">
            <div class="col-12">
                <!-- Profile Selection -->
                <div class="row mb-3">
                    <div class="col-md-3">
                        <select-input label="Select Profile"
                                      [(ngModel)]="selectedProfileId"
                                      (ngModelChange)="loadPermissions()"
                                      [options]="profiles"
                                      valueField="profileId"
                                      labelField="profileName"
                                      placeholder="Ex. Admin">
                        </select-input>
                    </div>
                </div>

                <div *ngIf="selectedProfileId" class="table-responsive">
                    <table mat-table [dataSource]="dataSource" class="w-100 table-hover" style="min-width: 800px;">

                        <!-- Menu Name Column -->
                        <ng-container matColumnDef="menuName">
                            <th mat-header-cell *matHeaderCellDef> Menu Name </th>
                            <td mat-cell *matCellDef="let element"
                                [style.padding-left.em]="element.parentMenuId ? 2 : 0">
                                <span *ngIf="element.parentMenuId" class="text-muted me-1">↳</span>
                                {{element.menuName}}
                            </td>
                        </ng-container>

                        <!-- View -->
                        <ng-container matColumnDef="canView">
                            <th mat-header-cell *matHeaderCellDef class="text-center"> View </th>
                            <td mat-cell *matCellDef="let element" class="text-center">
                                <mat-checkbox [(ngModel)]="element.canView" color="primary"></mat-checkbox>
                            </td>
                        </ng-container>

                        <!-- Create -->
                        <ng-container matColumnDef="canCreate">
                            <th mat-header-cell *matHeaderCellDef class="text-center"> Create </th>
                            <td mat-cell *matCellDef="let element" class="text-center">
                                <mat-checkbox [(ngModel)]="element.canCreate" color="primary"></mat-checkbox>
                            </td>
                        </ng-container>

                        <!-- Edit -->
                        <ng-container matColumnDef="canEdit">
                            <th mat-header-cell *matHeaderCellDef class="text-center"> Edit </th>
                            <td mat-cell *matCellDef="let element" class="text-center">
                                <mat-checkbox [(ngModel)]="element.canEdit" color="primary"></mat-checkbox>
                            </td>
                        </ng-container>

                        <!-- Delete -->
                        <ng-container matColumnDef="canDelete">
                            <th mat-header-cell *matHeaderCellDef class="text-center"> Delete </th>
                            <td mat-cell *matCellDef="let element" class="text-center">
                                <mat-checkbox [(ngModel)]="element.canDelete" color="primary"></mat-checkbox>
                            </td>
                        </ng-container>

                        <!-- Toggle All Row -->
                        <ng-container matColumnDef="actions">
                            <th mat-header-cell *matHeaderCellDef class="text-center"> All </th>
                            <td mat-cell *matCellDef="let element" class="text-center">
                                <button mat-icon-button (click)="toggleRow(element)">
                                    <mat-icon>done_all</mat-icon>
                                </button>
                            </td>
                        </ng-container>

                        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                    </table>
                </div>

                <div *ngIf="!selectedProfileId" class="text-center p-5 text-muted">
                    Select a profile to manage permissions.
                </div>
            </div>
        </div>
    </div>
</app-card>
        </div>
    </div>
</div>
