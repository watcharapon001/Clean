<div class="container-fluid py-4">

    <!-- Action Bar -->
    <app-action-bar backLink="/su/surt01">
        <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="form.invalid || isSaving()">
            <mat-icon *ngIf="!isSaving()">save</mat-icon>
            {{ isSaving() ? 'Saving...' : 'Save Changes' }}
        </button>
    </app-action-bar>

    <div class="row justify-content-center">
        <div class="col-12">
            <app-card title="Profile Details">

    <div class="card-content">
        <div class="row justify-content-center">
            <div class="col-12">
                <form [formGroup]="form" (ngSubmit)="onSubmit()" class="d-flex flex-column gap-3 p-3">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <textbox label="Profile Code" formControlName="profileCode" placeholder="Ex. ADMIN"></textbox>
                        </div>

                        <div class="col-md-6">
                            <textbox label="Profile Name" formControlName="profileName" placeholder="Ex. Administrator"></textbox>
                        </div>

                        <div class="col-12">
                            <mat-form-field appearance="outline" class="w-100">
                                <mat-label>Description</mat-label>
                                <textarea matInput formControlName="description" rows="3"></textarea>
                            </mat-form-field>
                        </div>

                        <div class="col-12">
                            <mat-checkbox formControlName="isActive" color="primary">Active</mat-checkbox>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</app-card>
        </div>
    </div>
</div>
