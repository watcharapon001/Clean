<app-card title="Profile Management (SURT01)">
    <div class="d-flex justify-content-end mb-3" actions>
        <button mat-flat-button color="primary" routerLink="/su/surt01/detail/new">
            <mat-icon>add</mat-icon> New Profile
        </button>
    </div>

    <div class="card-content">
        <div class="row">
            <div class="col-12">
                <table mat-table [dataSource]="dataSource" matSort class="w-100">
                    <!-- Index Column -->
                    <ng-container matColumnDef="index">
                        <th mat-header-cell *matHeaderCellDef> No. </th>
                        <td mat-cell *matCellDef="let element; let i = index"> {{i + 1}} </td>
                    </ng-container>

                    <!-- Profile Code Column -->
                    <ng-container matColumnDef="profileCode">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> Profile Code </th>
                        <td mat-cell *matCellDef="let element">
                            <a [routerLink]="['/su/surt01/detail', element.profileId]"
                                class="text-decoration-none fw-bold text-primary">
                                {{element.profileCode}}
                            </a>
                        </td>
                    </ng-container>

                    <!-- Profile Name Column -->
                    <ng-container matColumnDef="profileName">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> Profile Name </th>
                        <td mat-cell *matCellDef="let element"> {{element.profileName}} </td>
                    </ng-container>

                    <!-- Description Column -->
                    <ng-container matColumnDef="description">
                        <th mat-header-cell *matHeaderCellDef> Description </th>
                        <td mat-cell *matCellDef="let element"> {{element.description}} </td>
                    </ng-container>

                    <!-- Status Column -->
                    <ng-container matColumnDef="status">
                        <th mat-header-cell *matHeaderCellDef> Status </th>
                        <td mat-cell *matCellDef="let element">
                            <span class="badge" [ngClass]="element.isActive ? 'text-bg-success' : 'text-bg-secondary'">
                                {{ element.isActive ? 'Active' : 'Inactive' }}
                            </span>
                        </td>
                    </ng-container>

                    <!-- Actions Column -->
                    <ng-container matColumnDef="actions">
                        <th mat-header-cell *matHeaderCellDef> Actions </th>
                        <td mat-cell *matCellDef="let element">
                            <!-- Edit button removed as per request -->
                            <button mat-icon-button color="warn" (click)="deleteProfile(element)">
                                <mat-icon>delete</mat-icon>
                            </button>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                    <tr class="mat-row" *matNoDataRow>
                        <td class="mat-cell" colspan="6" class="p-4 text-center text-secondary">
                            No data matching the filter
                        </td>
                    </tr>
                </table>

                <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
            </div>
        </div>
    </div>
</app-card>
