<div class="container-fluid py-4">

  <!-- Action Bar -->
  <app-action-bar></app-action-bar>
  <app-card>
    <div class="card-content p-0">
      
      <!-- Filter Header -->
      <div class="p-3 border-bottom bg-light">
        <div class="row align-items-center">
            <div class="col-md-4">
                <input type="text" 
                       class="form-control" 
                       (keyup)="applyFilter($event)" 
                       placeholder="Search configs...">
            </div>
        </div>
      </div>

      <!-- Table Wrapper -->
      <div class="table-responsive">
        <table mat-table [dataSource]="dataSource" matSort class="w-100">

          <!-- ConfigKey Column -->
          <ng-container matColumnDef="configKey">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Configuration Key </th>
            <td mat-cell *matCellDef="let element" class="fw-bold text-primary"> {{element.configKey}} </td>
          </ng-container>

          <!-- ConfigValue Column -->
          <ng-container matColumnDef="configValue">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Value </th>
            <td mat-cell *matCellDef="let element">
               <span *ngIf="element.dataType === 'boolean'" class="px-2 py-1 rounded text-xs"
                    [ngClass]="element.configValue === 'true' ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-800'">
                {{ element.configValue === 'true' ? 'Enabled' : 'Disabled' }}
              </span>
              <span *ngIf="element.dataType !== 'boolean'" class="fw-semibold font-monospace bg-light px-2 py-1 rounded">
                {{ element.configValue }}
              </span>
            </td>
          </ng-container>

          <!-- Description Column -->
          <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef> Description </th>
            <td mat-cell *matCellDef="let element" class="text-muted text-sm text-truncate" style="max-width: 300px;">
                {{element.description || '-'}} 
            </td>
          </ng-container>

          <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="text-end"> Actions </th>
            <td mat-cell *matCellDef="let element" class="text-end">
              <button mat-icon-button color="primary" matTooltip="Edit Value" (click)="openDialog(element)">
                <mat-icon>edit</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover:bg-gray-50 transition-colors"></tr>

          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell text-center py-4 text-muted" colspan="4">
              No configurations found matching the filter.
            </td>
          </tr>
        </table>
      </div>

      <mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons></mat-paginator>

    </div>
  </app-card>
</div>
