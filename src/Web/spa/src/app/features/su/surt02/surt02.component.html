<div class="container-fluid py-4">

    <!-- Action Bar -->
    <app-action-bar>
        <button mat-raised-button color="primary" routerLink="/su/surt02/detail/new">
            <mat-icon>add</mat-icon> New Menu
        </button>
    </app-action-bar>

<app-card title="Menu Management (SURT02)">

    <div class="card-content">
        <div class="row">
            <div class="col-12">
                <table mat-table [dataSource]="dataSource" matSort class="w-100">
                    <!-- Index Column -->
                    <ng-container matColumnDef="index">
                        <th mat-header-cell *matHeaderCellDef> No. </th>
                        <td mat-cell *matCellDef="let element; let i = index"> {{i + 1}} </td>
                    </ng-container>

                    <!-- Menu Code Column -->
                    <ng-container matColumnDef="menuCode">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> Menu </th>
                        <td mat-cell *matCellDef="let element">
                            <a [routerLink]="['/su/surt02/detail', element.menuId]"
                                class="d-flex align-items-center py-2 text-decoration-none text-dark group-hover"
                                style="cursor: pointer;">
                                <div class="avatar bg-light text-primary rounded-circle d-flex align-items-center justify-content-center me-3"
                                    style="width: 40px; height: 40px;">
                                    <i [class]="element.icon || 'bi bi-grid'" style="font-size: 1.2rem;"></i>
                                </div>
                                <div>
                                    <div class="fw-bold hover-primary">{{ element.menuName }}</div>
                                    <div class="small text-muted">{{ element.menuCode }}</div>
                                </div>
                            </a>
                        </td>
                    </ng-container>

                    <!-- Parent Menu Column -->
                    <ng-container matColumnDef="parentMenu">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> Parent Menu </th>
                        <td mat-cell *matCellDef="let element"> {{element.parentMenuName || '-'}} </td>
                    </ng-container>

                    <!-- Route Column -->
                    <ng-container matColumnDef="route">
                        <th mat-header-cell *matHeaderCellDef> Route </th>
                        <td mat-cell *matCellDef="let element"> {{element.route || '-'}} </td>
                    </ng-container>

                    <!-- Sequence Column -->
                    <ng-container matColumnDef="sequence">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> Seq </th>
                        <td mat-cell *matCellDef="let element"> {{element.sequence}} </td>
                    </ng-container>

                    <!-- Status Column -->
                    <ng-container matColumnDef="status">
                        <th mat-header-cell *matHeaderCellDef> Status </th>
                        <td mat-cell *matCellDef="let element">
                            <span class="badge" [ngClass]="element.isActive ? 'text-bg-success' : 'text-bg-secondary'">
                                {{ element.isActive ? 'Active' : 'Inactive' }}
                            </span>
                        </td>
                    </ng-container>

                    <!-- Actions Column -->
                    <ng-container matColumnDef="actions">
                        <th mat-header-cell *matHeaderCellDef> Actions </th>
                        <td mat-cell *matCellDef="let element">
                            <!-- Edit button removed as per request -->
                            <button mat-icon-button color="warn" (click)="deleteMenu(element)">
                                <mat-icon>delete</mat-icon>
                            </button>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                    <tr class="mat-row" *matNoDataRow>
                        <td class="mat-cell" colspan="7" class="p-4 text-center text-secondary">
                            No data matching the filter
                        </td>
                    </tr>
                </table>

                <mat-paginator [length]="totalCount" [pageSizeOptions]="[10, 20, 50]" showFirstLastButtons></mat-paginator>
            </div>
        </div>
    </div>
</app-card>
</div>
