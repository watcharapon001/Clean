<app-card title="Menu Management (SURT02)">
    <div class="d-flex justify-content-end mb-3" actions>
        <button mat-flat-button color="primary" routerLink="/su/surt02/detail/new">
            <mat-icon>add</mat-icon> New Menu
        </button>
    </div>

    <div class="card-content">
        <div class="row">
            <div class="col-12">
                <table mat-table [dataSource]="dataSource" matSort class="w-100">
                    <!-- Index Column -->
                    <ng-container matColumnDef="index">
                        <th mat-header-cell *matHeaderCellDef> No. </th>
                        <td mat-cell *matCellDef="let element; let i = index"> {{i + 1}} </td>
                    </ng-container>

                    <!-- Menu Code Column -->
                    <ng-container matColumnDef="menuCode">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> Menu Code </th>
                        <td mat-cell *matCellDef="let element">
                            <a [routerLink]="['/su/surt02/detail', element.menuId]"
                                class="text-decoration-none fw-bold text-primary">
                                {{element.menuCode}}
                            </a>
                        </td>
                    </ng-container>

                    <!-- Menu Name Column -->
                    <ng-container matColumnDef="menuName">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> Menu Name </th>
                        <td mat-cell *matCellDef="let element">
                            <i [class]="element.icon || 'bi bi-circle'" class="me-2"></i>
                            {{element.menuName}}
                        </td>
                    </ng-container>

                    <!-- Parent Menu Column -->
                    <ng-container matColumnDef="parentMenu">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> Parent Menu </th>
                        <td mat-cell *matCellDef="let element"> {{element.parentMenuName || '-'}} </td>
                    </ng-container>

                    <!-- Route Column -->
                    <ng-container matColumnDef="route">
                        <th mat-header-cell *matHeaderCellDef> Route </th>
                        <td mat-cell *matCellDef="let element"> {{element.route || '-'}} </td>
                    </ng-container>

                    <!-- Sequence Column -->
                    <ng-container matColumnDef="sequence">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> Seq </th>
                        <td mat-cell *matCellDef="let element"> {{element.sequence}} </td>
                    </ng-container>

                    <!-- Status Column -->
                    <ng-container matColumnDef="status">
                        <th mat-header-cell *matHeaderCellDef> Status </th>
                        <td mat-cell *matCellDef="let element">
                            <span class="badge" [ngClass]="element.isActive ? 'text-bg-success' : 'text-bg-secondary'">
                                {{ element.isActive ? 'Active' : 'Inactive' }}
                            </span>
                        </td>
                    </ng-container>

                    <!-- Actions Column -->
                    <ng-container matColumnDef="actions">
                        <th mat-header-cell *matHeaderCellDef> Actions </th>
                        <td mat-cell *matCellDef="let element">
                            <!-- Edit button removed as per request -->
                            <button mat-icon-button color="warn" (click)="deleteMenu(element)">
                                <mat-icon>delete</mat-icon>
                            </button>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                    <tr class="mat-row" *matNoDataRow>
                        <td class="mat-cell" colspan="8" class="p-4 text-center text-secondary">
                            No data matching the filter
                        </td>
                    </tr>
                </table>

                <mat-paginator [pageSizeOptions]="[10, 20, 50]" showFirstLastButtons></mat-paginator>
            </div>
        </div>
    </div>
</app-card>
