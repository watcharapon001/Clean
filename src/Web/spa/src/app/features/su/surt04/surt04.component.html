<app-card title="User Management (SURT04)">
    <div class="d-flex justify-content-end mb-3" actions>
        <button mat-flat-button color="primary" routerLink="/su/surt04/detail/new">
            <mat-icon>add</mat-icon> New User
        </button>
    </div>

    <div class="card-content">
        <div class="row">
            <div class="col-12">
                <table mat-table [dataSource]="dataSource" matSort class="w-100">
                    <!-- Index Column -->
                    <ng-container matColumnDef="index">
                        <th mat-header-cell *matHeaderCellDef> No. </th>
                        <td mat-cell *matCellDef="let element; let i = index"> {{i + 1}} </td>
                    </ng-container>

                    <!-- Username Column -->
                    <ng-container matColumnDef="username">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> Username </th>
                        <td mat-cell *matCellDef="let element">
                            <a [routerLink]="['/su/surt04/detail', element.userId]"
                                class="text-decoration-none fw-bold text-primary">
                                {{element.username}}
                            </a>
                        </td>
                    </ng-container>

                    <!-- Employee Name Column -->
                    <ng-container matColumnDef="employeeName">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> Employee </th>
                        <td mat-cell *matCellDef="let element"> {{element.employeeName || '-'}} </td>
                    </ng-container>

                    <!-- Status Column -->
                    <ng-container matColumnDef="status">
                        <th mat-header-cell *matHeaderCellDef> Status </th>
                        <td mat-cell *matCellDef="let element">
                            <span class="badge" [ngClass]="element.isActive ? 'text-bg-success' : 'text-bg-secondary'">
                                {{ element.isActive ? 'Active' : 'Inactive' }}
                            </span>
                        </td>
                    </ng-container>

                    <!-- Actions Column -->
                    <ng-container matColumnDef="actions">
                        <th mat-header-cell *matHeaderCellDef> Actions </th>
                        <td mat-cell *matCellDef="let element">
                            <button mat-icon-button color="warn" (click)="deleteUser(element)">
                                <mat-icon>delete</mat-icon>
                            </button>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                    <tr class="mat-row" *matNoDataRow>
                        <td class="mat-cell" colspan="5" class="p-4 text-center text-secondary">
                            No data matching the filter
                        </td>
                    </tr>
                </table>

                <mat-paginator [pageSizeOptions]="[10, 20, 50]" showFirstLastButtons></mat-paginator>
            </div>
        </div>
    </div>
</app-card>
