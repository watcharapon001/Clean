<div class="container-fluid py-4">


    <!-- Action Bar -->
    <app-action-bar backLink="/db/dbrt01">
        <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="form.invalid || isLoading()">
            <mat-icon *ngIf="!isLoading()">save</mat-icon>
            <mat-spinner diameter="20" *ngIf="isLoading()" class="d-inline-block me-2"></mat-spinner>
            {{ isLoading() ? 'Saving...' : 'Save Changes' }}
        </button>
    </app-action-bar>

    <div class="row justify-content-center">
        <div class="col-12">
            <app-card [title]="(isEditMode() ? 'Edit' : 'New') + ' Employee Details'">

                <div class="card-content">
                    <div class="row">
                        <div class="col-12">
                            <form [formGroup]="form" (ngSubmit)="onSubmit()" class="d-flex flex-column gap-3 p-3">

                                <!-- Identity Section -->
                                <div class="row g-3">
                                    <div class="col-12">
                                        <h6 class="text-uppercase text-muted small fw-bold mb-3 border-bottom pb-2">
                                            Identity
                                        </h6>
                                    </div>

                                    <div class="col-md-4">
                                        <textbox label="Employee Code" formControlName="employeeCode" placeholder="EMP-001"></textbox>
                                    </div>

                                    <div class="col-md-8">
                                        <textbox label="Display Name" formControlName="displayName" placeholder="John Doe"></textbox>
                                    </div>

                                    <div class="col-md-6">
                                        <textbox label="First Name" formControlName="firstName" placeholder="John"></textbox>
                                    </div>

                                    <div class="col-md-6">
                                        <textbox label="Last Name" formControlName="lastName" placeholder="Doe"></textbox>
                                    </div>
                                </div>

                                <!-- Contact Section -->
                                <div class="row g-3 mt-2">
                                    <div class="col-12">
                                        <h6 class="text-uppercase text-muted small fw-bold mb-3 border-bottom pb-2">
                                            Contact
                                            Information</h6>
                                    </div>

                                    <div class="col-md-6">
                                        <textbox label="Email" formControlName="email" type="email" placeholder="john.doe@example.com"></textbox>
                                    </div>

                                    <div class="col-md-6">
                                        <textbox label="Phone" formControlName="phone" placeholder="+1 (555) 000-0000"></textbox>
                                    </div>
                                </div>

                                <!-- Settings Section -->
                                <div class="row g-3 mt-2">
                                    <div class="col-12">
                                        <h6 class="text-uppercase text-muted small fw-bold mb-3 border-bottom pb-2">
                                            Settings
                                        </h6>
                                    </div>

                                    <div class="col-12">
                                        <mat-checkbox formControlName="isActive" color="primary">
                                            Active Account
                                            <span class="d-block small text-muted fw-normal mt-1">
                                                Disable this to prevent the employee from logging in.
                                            </span>
                                        </mat-checkbox>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>

            </app-card>
        </div>
    </div>
</div>
