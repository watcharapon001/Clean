<div class="container-fluid py-4">
    <!-- Action Bar -->
    <app-action-bar>
        <a routerLink="/db/dbrt01/detail/new" mat-raised-button color="primary" class="d-flex align-items-center gap-2">
            <mat-icon>add</mat-icon>
            Add Employee
        </a>
    </app-action-bar>

    <app-card>
        <div class="card-content">
            <div class="row">
                <div class="col-12">
                    <div class="table-responsive">
                        <table mat-table [dataSource]="dataSource" matSort class="w-100">

                            <!-- Index Column -->
                            <ng-container matColumnDef="index">
                                <th mat-header-cell *matHeaderCellDef> # </th>
                                <td mat-cell *matCellDef="let element; let i = index" class="text-muted"> {{i + 1}}
                                </td>
                            </ng-container>

                            <!-- Employee Column -->
                            <ng-container matColumnDef="employee">
                                <th mat-header-cell *matHeaderCellDef mat-sort-header> Employee </th>
                                <td mat-cell *matCellDef="let element">
                                    <a [routerLink]="['/db/dbrt01/detail', element.employeeId]"
                                        class="d-flex align-items-center py-2 text-decoration-none text-dark group-hover"
                                        style="cursor: pointer;">
                                        <div class="avatar bg-light text-primary rounded-circle d-flex align-items-center justify-content-center me-3"
                                            style="width: 40px; height: 40px;">
                                            <mat-icon>person</mat-icon>
                                        </div>
                                        <div>
                                            <div class="fw-bold hover-primary">{{ element.firstName }} {{
                                                element.lastName }}
                                            </div>
                                            <div class="small text-muted">{{ element.employeeCode }}</div>
                                        </div>
                                    </a>
                                </td>
                            </ng-container>

                            <!-- Contact Column -->
                            <ng-container matColumnDef="contact">
                                <th mat-header-cell *matHeaderCellDef> Contact </th>
                                <td mat-cell *matCellDef="let element">
                                    <div class="text-dark">{{ element.email }}</div>
                                    <div class="small text-muted">{{ element.phone }}</div>
                                </td>
                            </ng-container>

                            <!-- Status Column -->
                            <ng-container matColumnDef="status">
                                <th mat-header-cell *matHeaderCellDef mat-sort-header> Status </th>
                                <td mat-cell *matCellDef="let element">
                                    <mat-chip-option [color]="element.isActive ? 'accent' : 'warn'" selected>
                                        {{ element.isActive ? 'Active' : 'Inactive' }}
                                    </mat-chip-option>
                                </td>
                            </ng-container>

                            <!-- Actions Column -->
                            <ng-container matColumnDef="actions">
                                <th mat-header-cell *matHeaderCellDef class="text-end pe-4"> Actions </th>
                                <td mat-cell *matCellDef="let element" class="text-end pe-4">
                                    <!-- Edit button removed as per request -->
                                    <button mat-icon-button color="warn" (click)="deleteEmployee(element)"
                                        matTooltip="Delete">
                                        <mat-icon>delete</mat-icon>
                                    </button>
                                </td>
                            </ng-container>

                            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                            <!-- Row shown when there is no matching data. -->
                            <tr class="mat-row" *matNoDataRow>
                                <td class="mat-cell text-center py-5" colspan="5">
                                    <div class="text-muted mb-2"><mat-icon class="fs-1"
                                            style="width: 48px; height: 48px; font-size: 48px;">people</mat-icon></div>
                                    <div class="text-muted">No employees found.</div>
                                </td>
                            </tr>
                        </table>

                        <mat-paginator [length]="totalCount" [pageSizeOptions]="[5, 10, 25, 100]"
                            aria-label="Select page of employees"></mat-paginator>
                    </div>
                </div>
            </div>
        </div>
    </app-card>
</div>
