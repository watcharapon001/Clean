<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>{{ isEditMode() ? 'Edit' : 'Add' }} Employee</h2>
        <a routerLink="/db/employees" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-2"></i>Back
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form [formGroup]="form" (ngSubmit)="onSubmit()">

                <div class="mb-3">
                    <label class="form-label">Employee Code</label>
                    <input type="text" class="form-control" formControlName="employeeCode"
                        [class.is-invalid]="form.get('employeeCode')?.invalid && form.get('employeeCode')?.touched">
                    <div class="invalid-feedback">Employee Code is required</div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">First Name</label>
                        <input type="text" class="form-control" formControlName="firstName"
                            [class.is-invalid]="form.get('firstName')?.invalid && form.get('firstName')?.touched">
                        <div class="invalid-feedback">First Name is required</div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Last Name</label>
                        <input type="text" class="form-control" formControlName="lastName">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Display Name</label>
                    <input type="text" class="form-control" formControlName="displayName">
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" formControlName="email">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Phone</label>
                        <input type="text" class="form-control" formControlName="phone">
                    </div>
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="isActive" formControlName="isActive">
                    <label class="form-check-label" for="isActive">Active</label>
                </div>

                <div class="d-flex justify-content-end">
                    <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Save</button>
                </div>

            </form>
        </div>
    </div>
</div>
