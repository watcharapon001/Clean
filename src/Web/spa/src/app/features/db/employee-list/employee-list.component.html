<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Employees</h2>
        <a routerLink="new" class="btn btn-primary">
            <i class="bi bi-plus-lg me-2"></i>Add Employee
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Code</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Status</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let emp of employees()">
                            <td>{{ emp.employeeCode }}</td>
                            <td>{{ emp.firstName }} {{ emp.lastName }}</td>
                            <td>{{ emp.email }}</td>
                            <td>{{ emp.phone }}</td>
                            <td>
                                <span class="badge" [ngClass]="emp.isActive ? 'bg-success' : 'bg-secondary'">
                                    {{ emp.isActive ? 'Active' : 'Inactive' }}
                                </span>
                            </td>
                            <td class="text-end">
                                <a [routerLink]="[emp.employeeId]" class="btn btn-sm btn-outline-primary me-2">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <button (click)="deleteEmployee(emp.employeeId)" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>
                        <tr *ngIf="employees().length === 0">
                            <td colspan="6" class="text-center py-4 text-muted">No employees found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
