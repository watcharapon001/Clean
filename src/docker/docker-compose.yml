services:
  postgres:
    image: postgres:16
    container_name: clean
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clean_db
      TZ: Asia/Bangkok
    ports:
      - "5432:5432"
    volumes:
      - clean_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  clean_pgdata:
